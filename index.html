<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 인천고 1학년 2반 진로진학시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/NanumSquareRound.woff');
    
    body {
      font-family: 'NanumSquareRound', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f8f0;
      background-image: radial-gradient(#e2e9d2 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: #3b4737;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #eef2e3;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #acc49d;
      border-radius: 10px;
      border: 2px solid #eef2e3;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8eab7d;
    }
  </style>
</head>
<body class="bg-[#f6f8f0] text-[#3b4737]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Lucide Icon Helper ---
    const Icon = ({ name, size = 18, className = "" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ fontSize: size, width: size, height: size }} className={`inline-block ${className}`}></i>;
    };

    // --- Data Constants ---
    const MOCK_STUDENTS_LIST = [
      { id: '10201', name: '강우석' }, { id: '10202', name: '김대규' }, { id: '10203', name: '김민성' },
      { id: '10204', name: '김민수' }, { id: '10205', name: '김석현' }, { id: '10206', name: '김예준' },
      { id: '10207', name: '김용하' }, { id: '10208', name: '김정윤' }, { id: '10209', name: '김태원' },
      { id: '10210', name: '김하준' }, { id: '10211', name: '박민규' }, { id: '10212', name: '박선우' },
      { id: '10213', name: '박세원' }, { id: '10214', name: '배윤찬' }, { id: '10215', name: '신우진' },
      { id: '10216', name: '신희범' }, { id: '10217', name: '안단태' }, { id: '10218', name: '안우현' },
      { id: '10219', name: '안현서' }, { id: '10220', name: '오주호' }, { id: '10221', name: '이현서' },
      { id: '10222', name: '이현준' }, { id: '10223', name: '임서후' }, { id: '10224', name: '한예준' }
    ];

    const INITIAL_PASSWORDS = {
      '10200': '0000',
      ...MOCK_STUDENTS_LIST.reduce((acc, student) => {
        acc[student.id] = '0000';
        return acc;
      }, {})
    };

    const ROADMAP_ITEMS = [
      '꿈두레 교육과정', '동아리 활동', '프로젝트 봉사활동', 
      '수요칼리지', '글로벌 칼리지', '학술제', '꿈이음대학', '기타 자율진로활동'
    ];

    const SUBJECT_OPTIONS = {
      sem1: {
        social: ['세계시민과 지리', '세계사', '정치', '경제', '윤리와 사상'],
        science: ['물리학', '화학', '생명과학', '지구과학']
      },
      sem2: {
        math: ['기하'],
        social: ['동아시아 역사 기행', '사회와 문화', '한국지리 탐구', '인문학과 윤리', '사회문제 탐구'],
        science: ['역할과 에너지', '물질과 에너지', '세포와 물질대사', '지구시스템과학', '과학융합탐구']
      }
    };

    // [수정사항 4] 학번과 이름 외 초기화된 학생 데이터
    const INITIAL_STUDENT_DATA = MOCK_STUDENTS_LIST.reduce((acc, student) => {
      acc[student.id] = {
        id: student.id,
        name: student.name,
        targetCareer: '',
        targetMajor: '',
        subjects: {
          sem1: { social: [], science: [] },
          sem2: { math: [], social: [], science: [] }
        },
        roadmapDetails: {},
        internalGrades: {
          sem1: { korean: null, math: null, english: null, history: null, social: null, science: null },
          sem2: { korean: null, math: null, english: null, history: null, social: null, science: null }
        },
        mockGrades: {
          mar: { korean: null, math: null, english: null, history: null, social: null, science: null },
          jun: { korean: null, math: null, english: null, history: null, social: null, science: null },
          sep: { korean: null, math: null, english: null, history: null, social: null, science: null },
          oct: { korean: null, math: null, english: null, history: null, social: null, science: null }
        },
        logs: []
      };
      return acc;
    }, {});

    // [수정사항 2] 경기진협 배치표 5등급제 -> 9등급제 환산 및 수시 추천 로직
    const getSusiRecommendation = (sem1Grades) => {
      const values = Object.values(sem1Grades).filter(v => v !== null && !isNaN(v) && v !== '');
      if (values.length === 0) return { range: '미산출', univs: '1학기 내신 성적 입력이 필요합니다.', tip: '내신을 입력해 주세요.', convertedAvg: null };
      
      const avg5 = values.reduce((a, b) => a + Number(b), 0) / values.length;
      // 경기진협 5등급제 -> 9등급제 환산 수식 (y = 1.8x - 0.8)
      const converted9 = (1.8 * avg5 - 0.8).toFixed(2);

      if (converted9 <= 1.5) {
        return { 
          range: `5등급제 ${avg5.toFixed(2)}등급 (9등급 환산: ${converted9}등급 / 최상위권)`, 
          univs: '서울대, 연세대, 고려대, 카이스트, 포스텍, 의약학계열 주요 학과', 
          tip: '학생부 종합전형 세특의 학업 역량 및 깊이 있는 탐구 보고서 완성이 핵심입니다.',
          convertedAvg: converted9
        };
      } else if (converted9 <= 2.2) {
        return { 
          range: `5등급제 ${avg5.toFixed(2)}등급 (9등급 환산: ${converted9}등급 / 상위권)`, 
          univs: '성균관대, 서강대, 한양대, 이화여대, 중앙대, 시립대 인기학과', 
          tip: '수능 최저학력기준 충족 유무가 합격의 주요 변수이므로 모의고사 성적 관리를 병행하세요.',
          convertedAvg: converted9
        };
      } else if (converted9 <= 3.2) {
        return { 
          range: `5등급제 ${avg5.toFixed(2)}등급 (9등급 환산: ${converted9}등급 / 중상위권)`, 
          univs: '경희대, 건국대, 동국대, 홍익대, 숙명여대, 인하대, 아주대', 
          tip: '희망 전공과 연계된 2학년 고교학점제 선택과목의 계열적합성을 집중 보완하세요.',
          convertedAvg: converted9
        };
      } else if (converted9 <= 4.5) {
        return { 
          range: `5등급제 ${avg5.toFixed(2)}등급 (9등급 환산: ${converted9}등급 / 중위권)`, 
          univs: '국민대, 숭실대, 세종대, 단국대, 인천대, 경기대, 가천대', 
          tip: '교과전형 최저 맞춤 지원과 탐구 세특의 진로 진정성을 어필하는 종합전형 병행을 추천합니다.',
          convertedAvg: converted9
        };
      } else {
        return { 
          range: `5등급제 ${avg5.toFixed(2)}등급 (9등급 환산: ${converted9}등급 / 수도권 및 지방거점)`, 
          univs: '수도권 주요 대학 및 지방 거점 국립대, 약술형 논술전형 고려', 
          tip: '취약 과목 성적 반등과 함께 약술형 논술 또는 수능 최저를 노린 교과 전형 전략을 다각화하세요.',
          convertedAvg: converted9
        };
      }
    };

    const getJeongsiRecommendation = (sepGrades) => {
      const values = Object.values(sepGrades).filter(v => v !== null && !isNaN(v) && v !== '');
      if (values.length === 0) return { range: '미산출', univs: '9월 학력평가 성적 입력이 필요합니다.', tip: '성적을 입력해 주세요.' };
      const avg = values.reduce((a, b) => a + Number(b), 0) / values.length;

      if (avg <= 1.3) {
        return { range: '1.0 ~ 1.3 등급 (수능 최상위권)', univs: '서울대, 연세대, 고려대, 의치한약수 주요 학과 정시 라인', tip: '취약 문항 탐구 및 만점 목표 실전 모의고사 훈련 필요.' };
      } else if (avg <= 1.8) {
        return { range: '1.4 ~ 1.8 등급 (수능 상위권)', univs: '서강대, 성균관대, 한양대, 중앙대 주요 공학/인문 계열', tip: '수학/탐구 영역 표준점수 높은 과목 집중 전략 체계화.' };
      } else if (avg <= 2.5) {
        return { range: '1.9 ~ 2.5 등급 (수능 중상위권)', univs: '경희대, 건국대, 동국대, 홍익대, 인하대 정시 지원권', tip: '영역별 가중치(수학/탐구 비율) 분석을 통한 정시 타깃 대학 선정.' };
      } else if (avg <= 3.5) {
        return { range: '2.6 ~ 3.5 등급 (수능 중위권)', univs: '숭실대, 세종대, 단국대, 인천대, 가천대 정시 지원권', tip: '탐구 한 과목 몰입 및 취약 영역 기출 유형 반복 숙달.' };
      } else {
        return { range: '3.6 등급 이하', univs: '수도권/지역 주요 대학 정시 안정 지원권', tip: '기본 개념 재정립과 영역별 핵심 배점 문항 취득 전략 수립.' };
      }
    };

    const getRoadmapAnalysis = (career, major, subjects, roadmapDetails) => {
      const sem1Count = (subjects?.sem1?.social?.length || 0) + (subjects?.sem1?.science?.length || 0);
      const sem2Count = (subjects?.sem2?.math?.length || 0) + (subjects?.sem2?.social?.length || 0) + (subjects?.sem2?.science?.length || 0);
      const detailCount = Object.values(roadmapDetails || {}).filter(v => v && v.trim() !== '').length;

      let strengths = [];
      let improvements = [];

      if (career && career.trim() !== '') {
        strengths.push(`'${career}'라는 명확한 진로 목표가 설정되어 있음.`);
      } else {
        improvements.push('진로 목표가 아직 미정이므로 세부 관심 분야 탐색이 우선 필요함.');
      }

      if (sem1Count + sem2Count >= 3) {
        strengths.push(`희망 계열(${major || '전공'})과 연계된 2학년 선택과목 이수 계획이 충실함.`);
      } else {
        improvements.push('진로 진학 계열성에 맞는 2학년 탐구/수학 선택 과목 보완 권장.');
      }

      if (detailCount >= 3) {
        strengths.push(`진로 로드맵 활동(${detailCount}개 항목)이 구체적으로 작성되어 진정성이 높음.`);
      } else {
        improvements.push('꿈두레, 수요칼리지, 학술제 등 창의적 체험활동 로드맵 항목 추가 작성 필요.');
      }

      return { strengths, improvements };
    };

    // --- Main App Component ---
    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('school_students_data_v6');
        return saved ? JSON.parse(saved) : INITIAL_STUDENT_DATA;
      });

      const [passwords, setPasswords] = useState(() => {
        const saved = localStorage.getItem('school_passwords_v6');
        return saved ? JSON.parse(saved) : INITIAL_PASSWORDS;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('school_appointments_v6');
        return saved ? JSON.parse(saved) : [];
      });

      const [currentUser, setCurrentUser] = useState(null);
      
      const [idInput, setIdInput] = useState('');
      const [pwInput, setPwInput] = useState('');
      const [loginError, setLoginError] = useState('');

      const [pwModalOpen, setPwModalOpen] = useState(false);
      const [changePwForm, setChangePwForm] = useState({ current: '', newPw: '', confirmPw: '' });
      const [pwChangeError, setPwChangeError] = useState('');

      // [수정사항 1] 교사용 전체 상담 내역 확인 모달 상태
      const [allAppointmentsModalOpen, setAllAppointmentsModalOpen] = useState(false);

      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('전체');

      const [activeTab, setActiveTab] = useState('career');
      const [newStudentModal, setNewStudentModal] = useState(false);
      const [newStudentForm, setNewStudentForm] = useState({ id: '', name: '' });

      useEffect(() => {
        localStorage.setItem('school_students_data_v6', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('school_passwords_v6', JSON.stringify(passwords));
      }, [passwords]);

      useEffect(() => {
        localStorage.setItem('school_appointments_v6', JSON.stringify(appointments));
      }, [appointments]);

      const handleLogin = (e) => {
        e.preventDefault();
        const code = idInput.trim();
        const inputPw = pwInput.trim();

        if (!code || !inputPw) {
          setLoginError('학번과 비밀번호를 모두 입력해 주세요.');
          return;
        }

        const savedPw = passwords[code];

        if (!savedPw) {
          setLoginError('존재하지 않는 학번(식별코드)입니다.');
          return;
        }

        if (savedPw !== inputPw) {
          setLoginError('비밀번호가 일치하지 않습니다. (초기 비밀번호: 0000)');
          return;
        }

        if (code === '10200') {
          setCurrentUser({ role: 'teacher', id: '10200' });
        } else {
          setCurrentUser({ role: 'student', id: code });
          setSelectedStudentId(code);
        }
        setLoginError('');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIdInput('');
        setPwInput('');
        setSelectedStudentId(null);
      };

      const handleChangePassword = (e) => {
        e.preventDefault();
        setPwChangeError('');

        const { current, newPw, confirmPw } = changePwForm;

        if (passwords[currentUser.id] !== current) {
          setPwChangeError('현재 비밀번호가 일치하지 않습니다.');
          return;
        }

        if (!/^\d{4}$/.test(newPw)) {
          setPwChangeError('새 비밀번호는 숫자 4자리여야 합니다.');
          return;
        }

        if (newPw !== confirmPw) {
          setPwChangeError('새 비밀번호와 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        setPasswords(prev => ({ ...prev, [currentUser.id]: newPw }));
        alert('비밀번호가 성공적으로 변경되었습니다!');
        setPwModalOpen(false);
        setChangePwForm({ current: '', newPw: '', confirmPw: '' });
      };

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!newStudentForm.id || !newStudentForm.name) return;
        if (students[newStudentForm.id]) {
          alert('이미 존재하는 학번입니다.');
          return;
        }

        const newStudent = {
          id: newStudentForm.id,
          name: newStudentForm.name,
          targetCareer: '',
          targetMajor: '',
          subjects: { sem1: { social: [], science: [] }, sem2: { math: [], social: [], science: [] } },
          roadmapDetails: {},
          internalGrades: {
            sem1: { korean: null, math: null, english: null, history: null, social: null, science: null },
            sem2: { korean: null, math: null, english: null, history: null, social: null, science: null }
          },
          mockGrades: {
            mar: { korean: null, math: null, english: null, history: null, social: null, science: null },
            jun: { korean: null, math: null, english: null, history: null, social: null, science: null },
            sep: { korean: null, math: null, english: null, history: null, social: null, science: null },
            oct: { korean: null, math: null, english: null, history: null, social: null, science: null }
          },
          logs: []
        };

        setStudents(prev => ({ ...prev, [newStudentForm.id]: newStudent }));
        setPasswords(prev => ({ ...prev, [newStudentForm.id]: '0000' }));
        setNewStudentForm({ id: '', name: '' });
        setNewStudentModal(false);
      };

      const filteredStudentsList = useMemo(() => {
        return Object.values(students).filter(s => {
          const matchesSearch = s.name.includes(searchQuery) || 
                                (s.targetCareer && s.targetCareer.includes(searchQuery)) || 
                                (s.targetMajor && s.targetMajor.includes(searchQuery));
          if (filterCategory === '전체') return matchesSearch;
          return matchesSearch && s.logs.some(log => log.category === filterCategory);
        });
      }, [students, searchQuery, filterCategory]);

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-[#fffdf7] p-8 rounded-[2.5rem] shadow-lg w-full max-w-md border-4 border-[#e8edd8] relative overflow-hidden">
              <div className="absolute -top-6 -right-6 w-20 h-20 bg-[#e3eed4] rounded-full opacity-60"></div>
              <div className="absolute -bottom-6 -left-6 w-24 h-24 bg-[#fff3d1] rounded-full opacity-60"></div>
              
              <div className="text-center mb-6 relative z-10">
                <div className="inline-flex p-4 rounded-3xl bg-[#7ba05b] text-white shadow-md mb-3 transform -rotate-3">
                  <Icon name="trees" size={38} />
                </div>
                <h1 className="text-xl font-extrabold text-[#4a5843] tracking-tight">2026 인천고 1학년 2반<br/>진로진학시스템</h1>
                <p className="text-[#72826a] text-xs font-bold mt-2 bg-[#f0f4e6] py-1 px-3 rounded-full inline-block">
                  🌱 학번 & 비밀번호로 통합 로그인
                </p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4 relative z-10">
                <div>
                  <label className="block text-xs font-extrabold text-[#5c6d54] mb-1.5 ml-1">학번 (식별 코드)</label>
                  <input
                    type="text"
                    required
                    className="w-full px-4 py-3 rounded-2xl bg-[#f7f9f1] border-2 border-[#dbe4cd] text-[#3b4737] font-bold placeholder-[#a3b39a] focus:outline-none focus:border-[#7ba05b] transition"
                    placeholder="교사: 10200 / 학생: 10201~10224"

    // --- Student Detail View Component ---
    function StudentDetailView({ student, isTeacher, activeTab: propActiveTab, setStudents, appointments, setAppointments, students }) {

      const [mockGradesForm, setMockGradesForm] = useState(student.mockGrades);

        setMockGradesForm(student.mockGrades);

      // AI Analysis Computations
      const susiAiResult = useMemo(() => getSusiRecommendation(internalGradesForm.sem1), [internalGradesForm.sem1]);
      const jeongsiAiResult = useMemo(() => getJeongsiRecommendation(mockGradesForm.sep), [mockGradesForm.sep]);
      const roadmapAiResult = useMemo(() => getRoadmapAnalysis(careerForm, majorForm, subjectsForm, roadmapDetailsForm), [careerForm, majorForm, subjectsForm, roadmapDetailsForm]);

      // --- Chart Rendering Effect ---

        if (currentTab === 'grades') {

            const sem1Vals = Object.values(internalGradesForm.sem1).filter(v => v !== null && !isNaN(v) && v !== '');
            const sem1Avg = sem1Vals.length > 0 ? (sem1Vals.reduce((a,b)=>a+Number(b),0)/sem1Vals.length).toFixed(2) : null;
            
            const sem2Vals = Object.values(internalGradesForm.sem2).filter(v => v !== null && !isNaN(v) && v !== '');
            const sem2Avg = sem2Vals.length > 0 ? (sem2Vals.reduce((a,b)=>a+Number(b),0)/sem2Vals.length).toFixed(2) : null;

            internalChartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: ['1학년 1학기 내신', '1학년 2학기 내신 (미산출)'],
                datasets: [{
                  label: '평균 등급 (1~5등급 기준, 낮을수록 우수)',

          // Render Mock Exam Grades Chart
          if (mockChartRef.current) {
            if (mockChartInstance.current) mockChartInstance.current.destroy();
            const ctx = mockChartRef.current.getContext('2d');

            const getAvg = (obj) => {
              const vals = Object.values(obj).filter(v => v !== null && !isNaN(v) && v !== '');
              return vals.length > 0 ? (vals.reduce((a,b)=>a+Number(b),0)/vals.length).toFixed(2) : null;
            };

            const marAvg = getAvg(mockGradesForm.mar);

      const toggleSubject = (sem, category, subject) => {

        setSubjectsForm(prev => {
          const currentList = prev[sem][category] || [];
          const exists = currentList.includes(subject);
          const updated = exists ? currentList.filter(s => s !== subject) : [...currentList, subject];
          return {
            ...prev,

      const saveCareerData = () => {
        setStudents(prev => ({

      const handleAddLog = (e) => {
        e.preventDefault();

        const updatedLogs = [...student.logs, { id: Date.now(), ...newLog }];

      const handleDeleteLog = (logId) => {

        const updatedLogs = student.logs.filter(l => l.id !== logId);
        setStudents(prev => ({
          ...prev,
          [student.id]: { ...prev[student.id], logs: updatedLogs }

      const handleCancelAppointment = (appId) => {
        if (!confirm('신청하신 상담을 취소하시겠습니까?')) return;
        setAppointments(prev => prev.filter(a => a.id !== appId));
      };

      const bookingSlotsCount = useMemo(() => {
        if (!bookingForm.date || !appointments) return 0;
        return appointments.filter(a => a.date === bookingForm.date && a.status !== '거절').length;
      }, [bookingForm.date, appointments]);

      const handleBookingSubmit = (e) => {
        e.preventDefault();
        if (!bookingForm.date || !bookingForm.reason) {
          alert('날짜와 상담 사유를 입력해 주세요.');
          return;
        }

        const day = new Date(bookingForm.date).getDay();
        if (day === 0 || day === 6) {
          alert('평일에만 상담 신청이 가능합니다.');
          return;
        }

        if (bookingSlotsCount >= 2) {
          alert('해당 일자는 하루 정원(2명)이 마감되었습니다.');
          return;
        }

        const newApp = {
          id: Date.now(),
          studentId: student.id,
          name: student.name,
          date: bookingForm.date,
          category: bookingForm.category,
          reason: bookingForm.reason,
          status: '신청'

        alert('상담 신청이 완료되었습니다.');
        setBookingForm({ date: '', category: '성적 향상 및 학습 전략', reason: '' });

                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#8c9e83] mb-1">상담 분야</label>
                      <select
                        className="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.category}
                        onChange={(e) => setBookingForm({ ...bookingForm, category: e.target.value })}
                      >
                        <option value="성적 향상 및 학습 전략">성적 향상 및 학습 전략</option>
                        <option value="진로진학 및 고교학점제">진로진학 및 고교학점제</option>
                        <option value="기타 개인적인 고민">기타 개인적인 고민</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#8c9e83] mb-1">상담 사유</label>
                      <textarea
                        rows="3"
                        required
                        placeholder="상담을 희망하는 내용을 자유롭게 작성해 주세요."
                        className="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] placeholder-[#a1b398] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.reason}
                        onChange={(e) => setBookingForm({ ...bookingForm, reason: e.target.value })}
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={bookingSlotsCount >= 2}
                      className={`w-full py-3.5 text-white font-extrabold rounded-2xl text-xs transition shadow-md ${
                        bookingSlotsCount >= 2 ? 'bg-[#c3cfb8] cursor-not-allowed' : 'bg-[#7ba05b] hover:bg-[#688a4a]'
                      }`}
                    >
                      {bookingSlotsCount >= 2 ? '해당 일자 상담이 마감되었습니다' : '상담 신청 제출하기'}
                    </button>
                  </form>

                  {/* Student Appointment List */}
                  <div className="bg-[#fffdf7] p-5 rounded-3xl border-2 border-[#e3eed4] space-y-3">
                    <h4 className="font-extrabold text-[#4a5843] text-xs">나의 상담 신청 현황</h4>
                    <div className="space-y-2">
                      {appointments.filter(a => a.studentId === student.id).length === 0 ? (
                        <p className="text-xs font-bold text-[#8c9e83]">신청 내역이 없습니다.</p>
                      ) : (
                        appointments.filter(a => a.studentId === student.id).map(app => (
                          <div key={app.id} className="bg-[#f8faf2] p-3.5 rounded-2xl border-2 border-[#e3eed4] flex justify-between items-center text-xs font-bold">
                            <div>
                              <div className="text-[#4a5843]">{app.date} <span className="text-[#8c9e83]">({app.category})</span></div>
                              <div className="text-[#72826a] text-[11px] font-bold mt-0.5">{app.reason}</div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`px-3 py-1 rounded-full text-[10px] font-extrabold ${
                                app.status === '승인' ? 'bg-[#eaf4f0] text-[#2a5241] border border-[#b8decb]' : 'bg-[#fff3d1] text-[#7a5b28] border border-[#f2d99d]'
                              }`}>
                                {app.status}
                              </span>
                              <button
                                onClick={() => handleCancelAppointment(app.id)}
                                className="text-[11px] text-[#d96b63] hover:text-[#b54c44] font-extrabold bg-[#fcf0f0] px-2.5 py-1 rounded-xl border border-[#f0c8c8] transition"
                              >
                                취소
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
