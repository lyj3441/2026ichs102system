    // 5등급제 평균 성적(1.0~5.0)을 9등급제로 직접 변환하는 통합 함수
    function convert5To9Grade(avg5Input) {
      const avg5 = parseFloat(avg5Input);
      if (isNaN(avg5) || avg5 <= 0) return "미산출";

      let p = 50.0;
      if (avg5 <= 1.0) {
        p = 2.0;
      } else if (avg5 <= 2.0) {
        p = 2.0 + (avg5 - 1.0) * 8.0;
      } else if (avg5 <= 3.0) {
        p = 10.0 + (avg5 - 2.0) * 24.0;
      } else if (avg5 <= 4.0) {
        p = 34.0 + (avg5 - 3.0) * 32.0;
      } else {
        p = 66.0 + (avg5 - 4.0) * 24.0;
      }

      const prob = p / 100;
      function normSInv(pVal) {
        if (pVal >= 1) return 8;
        if (pVal <= 0) return -8;
        let q;
        if (pVal < 0.5) {
          q = Math.sqrt(-2 * Math.log(pVal));
          return -(((0.010328 * q + 0.802853) * q + 2.515517) / (((0.001308 * q + 0.189269) * q + 1.432788) * q + 1));
        } else {
          q = Math.sqrt(-2 * Math.log(1 - pVal));
          return (((0.010328 * q + 0.802853) * q + 2.515517) / (((0.001308 * q + 0.189269) * q + 1.432788) * q + 1));
        }
      }

      const z = normSInv(prob);
      const converted = 5 + (1.75 * z);
      const finalGrade = Math.max(1.00, Math.min(9.00, converted));

      return finalGrade.toFixed(2);
    }

    // AI 수시 추천 함수

    const getRoadmapAnalysis = (career, major, field, subjects, roadmapDetails) => {
      const sem1Count = (subjects?.sem1?.social?.length || 0) + (subjects?.sem1?.science?.length || 0);

      }

      return { strengths, improvements };

    // --- Student Detail View Component ---
    function StudentDetailView({ student, isTeacher, activeTab: propActiveTab, appointments }) {

        sem2: { math: [], social: [], science: [] }

      const [roadmapDetailsForm, setRoadmapDetailsForm] = useState(student?.roadmapDetails || {});

      const [internalGradesForm, setInternalGradesForm] = useState(student?.internalGrades || {
        sem1: { korean: null, math: null, english: null, history: null, social: null, science: null },
        sem2: { korean: null, math: null, english: null, history: null, social: null, science: null }
      });

      const [mockGradesForm, setMockGradesForm] = useState(student?.mockGrades || {
        mar: { korean: null, math: null, english: null, history: null, social: null, science: null },
        jun: { korean: null, math: null, english: null, history: null, social: null, science: null },
        sep: { korean: null, math: null, english: null, history: null, social: null, science: null },
        oct: { korean: null, math: null, english: null, history: null, social: null, science: null }
      });

      const internalChartRef = useRef(null);
      const mockChartRef = useRef(null);
      const internalChartInstance = useRef(null);
      const mockChartInstance = useRef(null);

      const [newLog, setNewLog] = useState({
        date: new Date().toISOString().split('T')[0],
        category: '성적 향상 및 학습 전략',
        content: '',
        plan: '',
        privateNote: ''

        date: '',
        category: '성적 향상 및 학습 전략',
        reason: ''

          setCareerForm(student.targetCareer || '미정');

            sem1: { social: [], science: [] },
            sem2: { math: [], social: [], science: [] }

          setRoadmapDetailsForm(student.roadmapDetails || {});

            sem2: { korean: null, math: null, english: null, history: null, social: null, science: null }

          setMockGradesForm(student.mockGrades || {
            mar: { korean: null, math: null, english: null, history: null, social: null, science: null },
            jun: { korean: null, math: null, english: null, history: null, social: null, science: null },
            sep: { korean: null, math: null, english: null, history: null, social: null, science: null },
            oct: { korean: null, math: null, english: null, history: null, social: null, science: null }
          });
        }
      }, [student]);

      const susiAiResult = useMemo(() => getSusiRecommendation(internalGradesForm), [internalGradesForm]);
      const jeongsiAiResult = useMemo(() => getJeongsiRecommendation(mockGradesForm), [mockGradesForm]);
      const roadmapAiResult = useMemo(() => getRoadmapAnalysis(careerForm, majorForm, fieldForm, subjectsForm, roadmapDetailsForm), [careerForm, majorForm, fieldForm, subjectsForm, roadmapDetailsForm]);

      // --- Chart Rendering Effect ---
      useEffect(() => {
        if (currentTab === 'grades') {
          if (internalChartRef.current) {
            if (internalChartInstance.current) internalChartInstance.current.destroy();
            const ctx = internalChartRef.current.getContext('2d');
            
            const sem1Vals = Object.values(internalGradesForm.sem1 || {}).filter(v => v !== null && v !== '' && !isNaN(v));
            const sem1Avg = sem1Vals.length > 0 ? (sem1Vals.reduce((a,b)=>a+Number(b),0)/sem1Vals.length).toFixed(2) : null;
            
            const sem2Vals = Object.values(internalGradesForm.sem2 || {}).filter(v => v !== null && v !== '' && !isNaN(v));
            const sem2Avg = sem2Vals.length > 0 ? (sem2Vals.reduce((a,b)=>a+Number(b),0)/sem2Vals.length).toFixed(2) : null;

            internalChartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: ['1학년 1학기 내신', '1학년 2학기 내신'],
                datasets: [{

            const getAvg = (obj) => {
              const vals = Object.values(obj || {}).filter(v => v !== null && v !== '' && !isNaN(v));
              return vals.length > 0 ? (vals.reduce((a,b)=>a+Number(b),0)/vals.length).toFixed(2) : null;

            const junAvg = getAvg(mockGradesForm.jun);

            const octAvg = getAvg(mockGradesForm.oct);

            mockChartInstance.current = new Chart(ctx, {

                  pointRadius: 6,
                  pointBackgroundColor: '#234235',

                    max: 9,
                    title: { display: true, text: '모의고사 등급 (1~9)' }

                }

            });
          }
        }
      }, [currentTab, internalGradesForm, mockGradesForm]);

      const toggleSubject = (sem, category, subject) => {
        if (!isTeacher) return;
        setSubjectsForm(prev => {
          const currentList = prev[sem][category] || [];
          const exists = currentList.includes(subject);
          const updated = exists ? currentList.filter(s => s !== subject) : [...currentList, subject];
          return {
            ...prev,

          };
        });

      const saveCareerData = async () => {
        await db.collection('students').doc(student.id).update({
          targetCareer: careerForm,
          targetMajor: majorForm,
          targetField: fieldForm,
          subjects: subjectsForm,
          roadmapDetails: roadmapDetailsForm

        alert('진로, 선택과목 및 로드맵 세부사항이 Firestore에 저장되었습니다.');

      const saveGradesData = async () => {
        await db.collection('students').doc(student.id).update({
          internalGrades: internalGradesForm,
          mockGrades: mockGradesForm

      const handleAddLog = async (e) => {
        e.preventDefault();
        if (!newLog.content) return;
        const updatedLogs = [...(student.logs || []), { id: Date.now(), ...newLog }];
        await db.collection('students').doc(student.id).update({ logs: updatedLogs });

        setNewLog({
          date: new Date().toISOString().split('T')[0],
          category: '성적 향상 및 학습 전략',
          content: '',
          plan: '',
          privateNote: ''
        });
      };

      const handleDeleteLog = async (logId) => {
        if (!confirm('이 상담 기록을 삭제하시겠습니까?')) return;
        const updatedLogs = student.logs.filter(l => l.id !== logId);
        await db.collection('students').doc(student.id).update({ logs: updatedLogs });
      };

      const handleCancelAppointment = async (appId) => {
        if (!confirm('신청하신 상담을 취소하시겠습니까?')) return;
        await db.collection('appointments').doc(appId).delete();
      };

      const bookingSlotsCount = useMemo(() => {
        if (!bookingForm.date || !appointments) return 0;
        return appointments.filter(a => a.date === bookingForm.date && a.status !== '거절').length;
      }, [bookingForm.date, appointments]);

      const handleBookingSubmit = async (e) => {
        e.preventDefault();
        if (!bookingForm.date || !bookingForm.reason) {
          alert('날짜와 상담 사유를 입력해 주세요.');
          return;
        }

        const day = new Date(bookingForm.date).getDay();
        if (day === 0 || day === 6) {
          alert('평일에만 상담 신청이 가능합니다.');
          return;
        }

        if (bookingSlotsCount >= 2) {
          alert('해당 일자는 하루 정원(2명)이 마감되었습니다.');
          return;
        }

        const newApp = {
          studentId: student.id,
          name: student.name,
          date: bookingForm.date,
          category: bookingForm.category,
          reason: bookingForm.reason,
          status: '신청'
        };

        await db.collection('appointments').add(newApp);
        alert('상담 신청이 완료되었습니다.');
        setBookingForm({ date: '', category: '성적 향상 및 학습 전략', reason: '' });

                  <span className="text-[11px] font-bold text-[#7ba05b] bg-[#f0f5e8] px-2.5 py-1 rounded-full">개별 중복 체크</span>

                            <button

                                isSelected ? 'bg-[#7ba05b] text-white border-[#688a4a]' : 'bg-[#fffdf7] text-[#6c7d64] border-[#dde5d0]'

                                  <Icon name="heart" size={14} className="text-[#7ba05b]" /> 선생님 조언
                                </div>
                                <div>{log.plan}</div>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleBookingSubmit} className="bg-[#fffdf7] p-5 rounded-3xl border-2 border-[#e3eed4] shadow-sm space-y-4">
                    <h3 className="font-extrabold text-[#4a5843] text-sm flex items-center gap-2">
                      <Icon name="calendar" size={16} className="text-[#7ba05b]" /> 담임선생님 1:1 상담 신청
                    </h3>

                    <div>
                      <label className="block text-xs font-bold text-[#8c9e83] mb-1">희망 상담 일자 (평일만 가능)</label>
                      <input
                        type="date"
                        required
                        className="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.date}
                        onChange={(e) => setBookingForm({ ...bookingForm, date: e.target.value })}
                      />

                      {bookingForm.date && (
                        <div className="mt-2.5 p-3 rounded-2xl border-2 flex justify-between items-center transition bg-[#f8faf2] border-[#e3eed4]">
                          <div className="text-xs font-extrabold text-[#4a5843]">
                            📅 선택 일자 예약 현황: <span className="text-[#7ba05b]">{bookingSlotsCount} / 2명</span>
                          </div>
                          {bookingSlotsCount >= 2 ? (
                            <span className="px-3 py-1 bg-[#f8ebf2] text-[#d96b63] border border-[#f2d0db] rounded-full text-xs font-extrabold flex items-center gap-1">
                              🔴 당일 마감 완료
                            </span>
                          ) : (
                            <span className="px-3 py-1 bg-[#eaf4f0] text-[#3a6351] border border-[#c1e2d4] rounded-full text-xs font-extrabold flex items-center gap-1">
                              🟢 신청 가능
                            </span>
                          )}
                        </div>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#8c9e83] mb-1">상담 분야</label>
                      <select
                        className="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.category}
                        onChange={(e) => setBookingForm({ ...bookingForm, category: e.target.value })}
                      >
                        <option value="성적 향상 및 학습 전략">성적 향상 및 학습 전략</option>
                        <option value="진로진학 및 고교학점제">진로진학 및 고교학점제</option>
                        <option value="기타 개인적인 고민">기타 개인적인 고민</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-[#8c9e83] mb-1">상담 사유</label>
                      <textarea
                        rows="3"
                        required
                        placeholder="상담을 희망하는 내용을 자유롭게 작성해 주세요."
                        className="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] placeholder-[#a1b398] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.reason}
                        onChange={(e) => setBookingForm({ ...bookingForm, reason: e.target.value })}
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={bookingSlotsCount >= 2}
                      className={`w-full py-3.5 text-white font-extrabold rounded-2xl text-xs transition shadow-md ${
                        bookingSlotsCount >= 2 ? 'bg-[#c3cfb8] cursor-not-allowed' : 'bg-[#7ba05b] hover:bg-[#688a4a]'
                      }`}
                    >
                      {bookingSlotsCount >= 2 ? '해당 일자 상담이 마감되었습니다' : '상담 신청 제출하기'}
                    </button>
                  </form>

                  <div className="bg-[#fffdf7] p-5 rounded-3xl border-2 border-[#e3eed4] space-y-3">
                    <h4 className="font-extrabold text-[#4a5843] text-xs">나의 상담 신청 현황</h4>
                    <div className="space-y-2">
                      {appointments.filter(a => a.studentId === student.id).length === 0 ? (
                        <p className="text-xs font-bold text-[#8c9e83]">신청 내역이 없습니다.</p>
                      ) : (
                        appointments.filter(a => a.studentId === student.id).map(app => (
                          <div key={app.id} className="bg-[#f8faf2] p-3.5 rounded-2xl border-2 border-[#e3eed4] flex justify-between items-center text-xs font-bold">
                            <div>
                              <div className="text-[#4a5843]">{app.date} <span className="text-[#8c9e83]">({app.category})</span></div>
                              <div className="text-[#72826a] text-[11px] font-bold mt-0.5">{app.reason}</div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`px-3 py-1 rounded-full text-[10px] font-extrabold ${
                                app.status === '승인' ? 'bg-[#eaf4f0] text-[#2a5241] border border-[#b8decb]' : 'bg-[#fff3d1] text-[#7a5b28] border border-[#f2d99d]'
                              }`}>
                                {app.status}
                              </span>
                              <button
                                onClick={() => handleCancelAppointment(app.id)}
                                className="text-[11px] text-[#d96b63] hover:text-[#b54c44] font-extrabold bg-[#fcf0f0] px-2.5 py-1 rounded-xl border border-[#f0c8c8] transition"
                              >
                                취소
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
