<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 인천고 1학년 2반 진로진학시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/NanumSquareRound.woff');
    
    body {
      font-family: 'NanumSquareRound', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f8f0;
      background-image: radial-gradient(#e2e9d2 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: #3b4737;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #eef2e3;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #acc49d;
      border-radius: 10px;
      border: 2px solid #eef2e3;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8eab7d;
    }
  </style>
</head>
<body class="bg-[#f6f8f0] text-[#3b4737]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Lucide Icon Helper ---
    const Icon = ({ name, size = 18, className = "" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ fontSize: size, width: size, height: size }} class={`inline-block ${className}`}></i>;
    };

    // --- Data Constants ---
    const MOCK_STUDENTS_LIST = [
      { id: '10201', name: '강우석' }, { id: '10202', name: '김대규' }, { id: '10203', name: '김민성' },
      { id: '10204', name: '김민수' }, { id: '10205', name: '김석현' }, { id: '10206', name: '김예준' },
      { id: '10207', name: '김용하' }, { id: '10208', name: '김정윤' }, { id: '10209', name: '김태원' },
      { id: '10210', name: '김하준' }, { id: '10211', name: '박민규' }, { id: '10212', name: '박선우' },
      { id: '10213', name: '박세원' }, { id: '10214', name: '배윤찬' }, { id: '10215', name: '신우진' },
      { id: '10216', name: '신희범' }, { id: '10217', name: '안단태' }, { id: '10218', name: '안우현' },
      { id: '10219', name: '안현서' }, { id: '10220', name: '오주호' }, { id: '10221', name: '이현서' },
      { id: '10222', name: '이현준' }, { id: '10223', name: '임서후' }, { id: '10224', name: '한예준' }
    ];

    // 초기 비밀번호 데이터 (교사 10200 + 학생 10201~10224 전부 '0000')
    const INITIAL_PASSWORDS = {
      '10200': '0000',
      ...MOCK_STUDENTS_LIST.reduce((acc, student) => {
        acc[student.id] = '0000';
        return acc;
      }, {})
    };

    const ROADMAP_ITEMS = [
      '꿈두레 교육과정', '진로 연계 동아리 활동', '프로젝트 봉사활동', 
      '수요칼리지', '글로벌 칼리지 심화 탐구', '학술제', '지역연계 꿈이음대학', '기타 자율진로활동'
    ];

    const SUBJECT_OPTIONS = {
      sem1: {
        social: ['세계시민과 지리', '세계사', '정치', '경제', '윤리와 사상'],
        science: ['물리학', '화학', '생명과학', '지구과학']
      },
      sem2: {
        math: ['기하'],
        social: ['동아시아 역사 기행', '사회와 문화', '한국지리 탐구', '인문학과 윤리', '사회문제 탐구'],
        science: ['역할과 에너지', '물질과 에너지', '세포와 물질대사', '지구시스템과학', '과학융합탐구']
      }
    };

    const INITIAL_STUDENT_DATA = MOCK_STUDENTS_LIST.reduce((acc, student) => {
      acc[student.id] = {
        id: student.id,
        name: student.name,
        targetCareer: '인공지능 소프트웨어 개발자',
        targetMajor: '컴퓨터공학과 / 인공지능학과',
        subjects: {
          sem1: { social: ['정치'], science: ['물리학', '화학'] },
          sem2: { math: ['기하'], social: ['사회와 문화'], science: ['세포와 물질대사', '물질과 에너지'] }
        },
        roadmapDetails: {
          '진로 연계 동아리 활동': '코딩 및 알고리즘 심화 탐구 동아리 부장 활동',
          '수요칼리지': '파이썬 기반 머신러닝 데이터 분석 실습 이수',
          '학술제': '인공지능 윤리 및 소셜 데이터 분석 발표 준비'
        },
        internalGrades: {
          sem1: { korean: 2, math: 1, english: 2, history: 1, social: 2, science: 1 },
          sem2: { korean: 1, math: 1, english: 2, history: 1, social: 1, science: 1 }
        },
        mockGrades: {
          mar: { korean: 2, math: 1, english: 2, history: 1, social: 2, science: 1 },
          jun: { korean: 1, math: 1, english: 1, history: 1, social: 1, science: 1 },
          sep: { korean: 2, math: 1, english: 1, history: 1, social: 1, science: 1 },
          oct: { korean: 1, math: 1, english: 1, history: 1, social: 1, science: 1 }
        },
        logs: [
          { id: 1, date: '2026-03-15', category: '성적 향상 및 학습 전략', content: '수학 상위권 유지 전략 및 국어 비문학 독해법 상담 진행.', plan: '매일 국어 기출 2지문 풀이 후 오답노트 작성 지도.' },
          { id: 2, date: '2026-04-10', category: '진로진학 및 고교학점제', content: '2학년 선택과목 관련 물리학, 기하 선택 타당성 검토.', plan: '공학 계열 진학을 위한 선택 과목 이수 로드맵 확정.' }
        ]
      };
      return acc;
    }, {});

    // --- Main App Component ---
    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('school_students_data_v4');
        return saved ? JSON.parse(saved) : INITIAL_STUDENT_DATA;
      });

      const [passwords, setPasswords] = useState(() => {
        const saved = localStorage.getItem('school_passwords_v4');
        return saved ? JSON.parse(saved) : INITIAL_PASSWORDS;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('school_appointments_v4');
        return saved ? JSON.parse(saved) : [
          { id: 1, studentId: '10201', name: '강우석', date: '2026-09-10', category: '진로진학 및 고교학점제', reason: '2학년 과목 선택 최종 점검 받고 싶습니다.', status: '승인' },
          { id: 2, studentId: '10203', name: '김민성', date: '2026-09-10', category: '성적 향상 및 학습 전략', reason: '9월 모의고사 오답 분석 지도 요청합니다.', status: '승인' }
        ];
      });

      const [currentUser, setCurrentUser] = useState(null);
      
      // Login Inputs
      const [idInput, setIdInput] = useState('');
      const [pwInput, setPwInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Password Change Modal
      const [pwModalOpen, setPwModalOpen] = useState(false);
      const [changePwForm, setChangePwForm] = useState({ current: '', newPw: '', confirmPw: '' });
      const [pwChangeError, setPwChangeError] = useState('');

      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('전체');

      const [activeTab, setActiveTab] = useState('career');
      const [newStudentModal, setNewStudentModal] = useState(false);
      const [newStudentForm, setNewStudentForm] = useState({ id: '', name: '' });

      useEffect(() => {
        localStorage.setItem('school_students_data_v4', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('school_passwords_v4', JSON.stringify(passwords));
      }, [passwords]);

      useEffect(() => {
        localStorage.setItem('school_appointments_v4', JSON.stringify(appointments));
      }, [appointments]);

      const handleLogin = (e) => {
        e.preventDefault();
        const code = idInput.trim();
        const inputPw = pwInput.trim();

        if (!code || !inputPw) {
          setLoginError('학번과 비밀번호를 모두 입력해 주세요.');
          return;
        }

        const savedPw = passwords[code];

        if (!savedPw) {
          setLoginError('존재하지 않는 학번(식별코드)입니다.');
          return;
        }

        if (savedPw !== inputPw) {
          setLoginError('비밀번호가 일치하지 않습니다. (초기 비밀번호: 0000)');
          return;
        }

        // 로그인 성공
        if (code === '10200') {
          setCurrentUser({ role: 'teacher', id: '10200' });
        } else {
          setCurrentUser({ role: 'student', id: code });
          setSelectedStudentId(code);
        }
        setLoginError('');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIdInput('');
        setPwInput('');
        setSelectedStudentId(null);
      };

      // 비밀번호 변경 처리
      const handleChangePassword = (e) => {
        e.preventDefault();
        setPwChangeError('');

        const { current, newPw, confirmPw } = changePwForm;

        if (passwords[currentUser.id] !== current) {
          setPwChangeError('현재 비밀번호가 일치하지 않습니다.');
          return;
        }

        if (!/^\d{4}$/.test(newPw)) {
          setPwChangeError('새 비밀번호는 숫자 4자리여야 합니다.');
          return;
        }

        if (newPw !== confirmPw) {
          setPwChangeError('새 비밀번호와 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        setPasswords(prev => ({ ...prev, [currentUser.id]: newPw }));
        alert('비밀번호가 성공적으로 변경되었습니다!');
        setPwModalOpen(false);
        setChangePwForm({ current: '', newPw: '', confirmPw: '' });
      };

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!newStudentForm.id || !newStudentForm.name) return;
        if (students[newStudentForm.id]) {
          alert('이미 존재하는 학번입니다.');
          return;
        }

        const newStudent = {
          id: newStudentForm.id,
          name: newStudentForm.name,
          targetCareer: '미정',
          targetMajor: '미정',
          subjects: { sem1: { social: [], science: [] }, sem2: { math: [], social: [], science: [] } },
          roadmapDetails: {},
          internalGrades: {
            sem1: { korean: 3, math: 3, english: 3, history: 3, social: 3, science: 3 },
            sem2: { korean: 3, math: 3, english: 3, history: 3, social: 3, science: 3 }
          },
          mockGrades: {
            mar: { korean: 3, math: 3, english: 3, history: 3, social: 3, science: 3 },
            jun: { korean: 3, math: 3, english: 3, history: 3, social: 3, science: 3 },
            sep: { korean: 3, math: 3, english: 3, history: 3, social: 3, science: 3 },
            oct: { korean: 3, math: 3, english: 3, history: 3, social: 3, science: 3 }
          },
          logs: []
        };

        setStudents(prev => ({ ...prev, [newStudentForm.id]: newStudent }));
        setPasswords(prev => ({ ...prev, [newStudentForm.id]: '0000' }));
        setNewStudentForm({ id: '', name: '' });
        setNewStudentModal(false);
      };

      const filteredStudentsList = useMemo(() => {
        return Object.values(students).filter(s => {
          const matchesSearch = s.name.includes(searchQuery) || 
                                s.targetCareer.includes(searchQuery) || 
                                s.targetMajor.includes(searchQuery);
          if (filterCategory === '전체') return matchesSearch;
          return matchesSearch && s.logs.some(log => log.category === filterCategory);
        });
      }, [students, searchQuery, filterCategory]);

      if (!currentUser) {
        return (
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-[#fffdf7] p-8 rounded-[2.5rem] shadow-lg w-full max-w-md border-4 border-[#e8edd8] relative overflow-hidden">
              <div class="absolute -top-6 -right-6 w-20 h-20 bg-[#e3eed4] rounded-full opacity-60"></div>
              <div class="absolute -bottom-6 -left-6 w-24 h-24 bg-[#fff3d1] rounded-full opacity-60"></div>
              
              <div class="text-center mb-6 relative z-10">
                <div class="inline-flex p-4 rounded-3xl bg-[#7ba05b] text-white shadow-md mb-3 transform -rotate-3">
                  <Icon name="trees" size={38} />
                </div>
                <h1 class="text-xl font-extrabold text-[#4a5843] tracking-tight">2026 인천고 1학년 2반<br/>진로진학시스템</h1>
                <p class="text-[#72826a] text-xs font-bold mt-2 bg-[#f0f4e6] py-1 px-3 rounded-full inline-block">
                  🌱 학번 & 비밀번호로 통합 로그인
                </p>
              </div>

              <form onSubmit={handleLogin} class="space-y-4 relative z-10">
                <div>
                  <label class="block text-xs font-extrabold text-[#5c6d54] mb-1.5 ml-1">학번 (식별 코드)</label>
                  <input
                    type="text"
                    required
                    class="w-full px-4 py-3 rounded-2xl bg-[#f7f9f1] border-2 border-[#dbe4cd] text-[#3b4737] font-bold placeholder-[#a3b39a] focus:outline-none focus:border-[#7ba05b] transition"
                    placeholder="교사: 10200 / 학생: 10201~10224"
                    value={idInput}
                    onChange={(e) => setIdInput(e.target.value)}
                  />
                </div>

                <div>
                  <label class="block text-xs font-extrabold text-[#5c6d54] mb-1.5 ml-1">비밀번호 (초기: 0000)</label>
                  <input
                    type="password"
                    required
                    maxLength="4"
                    class="w-full px-4 py-3 rounded-2xl bg-[#f7f9f1] border-2 border-[#dbe4cd] text-[#3b4737] font-bold placeholder-[#a3b39a] focus:outline-none focus:border-[#7ba05b] transition"
                    placeholder="숫자 4자리 비밀번호"
                    value={pwInput}
                    onChange={(e) => setPwInput(e.target.value)}
                  />
                </div>

                {loginError && <p class="text-[#d96b63] text-xs text-center font-bold">{loginError}</p>}

                <button
                  type="submit"
                  class="w-full py-3.5 bg-[#7ba05b] hover:bg-[#688a4a] text-white font-extrabold text-base rounded-2xl transition shadow-md hover:shadow-lg transform active:scale-98 flex items-center justify-center gap-2"
                >
                  <Icon name="sparkles" size={18} />
                  <span>시스템 로그인</span>
                </button>
              </form>

              <div class="mt-6 pt-4 border-t-2 border-dashed border-[#e3eed4] text-center text-[11px] font-bold text-[#8c9e83] space-y-1">
                <p>🍃 교사 학번: <span class="text-[#5c7a43]">10200</span> | 학생 학번: <span class="text-[#5c7a43]">10201~10224</span></p>
                <p>🔑 초기 비밀번호: <span class="text-[#d96b63]">0000</span> (로그인 후 변경 가능)</p>
              </div>
            </div>
          </div>
        );
      }

      const selectedStudent = selectedStudentId ? students[selectedStudentId] : null;

      return (
        <div class="min-h-screen bg-[#f6f8f0]">
          {/* Header */}
          <header class="bg-[#fffdf7] border-b-4 border-[#e8edd8] sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <div class="p-2.5 bg-[#7ba05b] text-white rounded-2xl shadow-sm transform -rotate-2">
                  <Icon name="trees" size={22} />
                </div>
                <div>
                  <h1 class="font-extrabold text-[#4a5843] text-sm sm:text-base">2026 인천고 1학년 2반 진로진학시스템</h1>
                  <p class="text-xs font-bold text-[#8a9e80] flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-[#7ba05b]"></span>
                    {currentUser.role === 'teacher' ? '교사 관리 모드 (10200)' : `학생 접속중 (${students[currentUser.id]?.name} / ${currentUser.id})`}
                  </p>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button
                  onClick={() => {
                    setPwChangeError('');
                    setChangePwForm({ current: '', newPw: '', confirmPw: '' });
                    setPwModalOpen(true);
                  }}
                  class="flex items-center gap-1.5 text-[#5c7a43] hover:text-[#3b4737] font-bold text-xs py-2 px-3 rounded-2xl bg-[#f0f5e8] hover:bg-[#e2ebd6] transition border border-[#d3e0c3]"
                >
                  <Icon name="key" size={15} />
                  <span class="hidden sm:inline">비밀번호 변경</span>
                </button>
                <button
                  onClick={handleLogout}
                  class="flex items-center gap-1.5 text-[#6c7d64] hover:text-[#3b4737] font-bold text-xs py-2 px-3 rounded-2xl bg-[#eef3e5] hover:bg-[#e2ebd6] transition border border-[#d3e0c3]"
                >
                  <Icon name="log-out" size={15} />
                  <span>로그아웃</span>
                </button>
              </div>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {currentUser.role === 'teacher' ? (
              /* TEACHER MODE */
              <div class="space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div class="bg-[#fffdf7] p-4 rounded-3xl border-2 border-[#e3eed4] shadow-sm">
                    <div class="text-[11px] font-extrabold text-[#8c9e83] mb-1">학급 기본 정보</div>
                    <div class="text-lg font-extrabold text-[#4a5843]">인천고 1학년 2반</div>
                    <div class="text-xs font-bold text-[#688a4a] mt-1 bg-[#f0f5e8] px-2 py-0.5 rounded-full inline-block">재학생 {Object.keys(students).length}명</div>
                  </div>
                  <div class="bg-[#fffdf7] p-4 rounded-3xl border-2 border-[#e3eed4] shadow-sm">
                    <div class="text-[11px] font-extrabold text-[#8c9e83] mb-1">예정된 상담 일정</div>
                    <div class="text-lg font-extrabold text-[#3a6351]">{appointments.filter(a => a.status === '승인').length}건</div>
                    <div class="text-xs font-bold text-[#4e826b] mt-1 bg-[#eaf4f0] px-2 py-0.5 rounded-full inline-block">승인 완료</div>
                  </div>
                  <div class="bg-[#fffdf7] p-4 rounded-3xl border-2 border-[#e3eed4] shadow-sm">
                    <div class="text-[11px] font-extrabold text-[#8c9e83] mb-1">누적 진로 상담</div>
                    <div class="text-lg font-extrabold text-[#486382]">
                      {Object.values(students).reduce((acc, s) => acc + s.logs.filter(l => l.category.includes('진로')).length, 0)}건
                    </div>
                    <div class="text-xs font-bold text-[#57799e] mt-1 bg-[#ebf2f8] px-2 py-0.5 rounded-full inline-block">고교학점제 연계</div>
                  </div>
                  <div class="bg-[#fffdf7] p-4 rounded-3xl border-2 border-[#e3eed4] shadow-sm">
                    <div class="text-[11px] font-extrabold text-[#8c9e83] mb-1">신규 신청 내역</div>
                    <div class="text-lg font-extrabold text-[#875c74]">
                      {appointments.filter(a => a.status === '신청').length}건
                    </div>

                          <button
                            onClick={() => {

                            승인하기

                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Filters */}
                <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center bg-[#fffdf7] p-4 rounded-3xl border-2 border-[#e3eed4] shadow-sm">
                  <div class="flex flex-1 gap-2">
                    <div class="relative flex-1">
                      <Icon name="search" size={16} className="absolute left-3.5 top-3.5 text-[#a1b398]" />
                      <input
                        type="text"
                        placeholder="학생 이름, 희망 진로, 학과 검색..."
                        class="w-full pl-10 pr-4 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] placeholder-[#a1b398] focus:outline-none focus:border-[#7ba05b] transition"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                      />
                    </div>
                    <select
                      class="px-3 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] focus:outline-none focus:border-[#7ba05b] transition"
                      value={filterCategory}
                      onChange={(e) => setFilterCategory(e.target.value)}
                    >
                      <option value="전체">전체 카테고리</option>
                      <option value="성적 향상 및 학습 전략">성적 향상 및 학습 전략</option>
                      <option value="진로진학 및 고교학점제">진로진학 및 고교학점제</option>
                      <option value="기타 개인적인 고민">기타 개인적인 고민</option>
                    </select>
                  </div>

                  <button
                    onClick={() => setNewStudentModal(true)}
                    class="flex items-center justify-center gap-1.5 bg-[#7ba05b] hover:bg-[#688a4a] text-white px-4 py-2.5 rounded-2xl text-xs font-extrabold transition shadow-sm"
                  >
                    <Icon name="plus" size={16} />
                    <span>신규 학생 등록</span>
                  </button>
                </div>

                {/* Cards Grid */}
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                  {filteredStudentsList.map(student => {
                    return (
                      <div
                        key={student.id}
                        onClick={() => {
                          setSelectedStudentId(student.id);
                          setActiveTab('career');
                        }}
                        class="bg-[#fffdf7] p-4 rounded-3xl border-2 border-[#e3eed4] hover:border-[#7ba05b] hover:shadow-md transition cursor-pointer flex flex-col justify-between group relative overflow-hidden"
                      >
                        <div class="relative z-10">
                          <div class="flex justify-between items-start mb-2">
                            <div>
                              <span class="text-[11px] font-extrabold text-[#8c9e83]">{student.id}</span>
                              <h3 class="text-base font-extrabold text-[#4a5843] group-hover:text-[#688a4a] transition">{student.name}</h3>
                            </div>
                            <span class="p-2 bg-[#eef4e6] text-[#688a4a] rounded-2xl">
                              <Icon name="smile" size={18} />
                            </span>
                          </div>
                          <div class="space-y-1 text-xs mb-3 font-bold">
                            <p class="text-[#596951]"><span class="text-[#8c9e83]">진로:</span> {student.targetCareer}</p>
                            <p class="text-[#596951]"><span class="text-[#8c9e83]">학과:</span> {student.targetMajor}</p>
                          </div>
                        </div>
                        <div class="pt-2.5 border-t-2 border-dashed border-[#eef3e5] flex justify-between items-center text-[11px] font-bold text-[#8c9e83] relative z-10">
                          <span>상담 기록 {student.logs.length}건</span>
                          <span class="text-[#688a4a]">관리하기 &rarr;</span>
                        </div>
                      </div>
                    );

              </div>
            ) : (
              /* STUDENT MODE */
              <StudentDetailView
                student={students[currentUser.id]}
                isTeacher={false}
                appointments={appointments}
                setAppointments={setAppointments}
                students={students}
              />
            )}
          </main>

          {/* Change Password Modal */}
          {pwModalOpen && (
            <div class="fixed inset-0 z-50 bg-[#2d3827]/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-[#fffdf7] w-full max-w-sm p-6 rounded-[2rem] shadow-2xl border-4 border-[#e3eed4]">
                <h3 class="text-lg font-extrabold text-[#4a5843] mb-4 flex items-center gap-2">
                  <Icon name="key" size={18} className="text-[#7ba05b]" /> 비밀번호 변경
                </h3>
                <form onSubmit={handleChangePassword} class="space-y-3">
                  <div>
                    <label class="block text-xs font-extrabold text-[#6c7d64] mb-1">현재 비밀번호</label>
                    <input
                      type="password"
                      required
                      maxLength="4"
                      class="w-full px-3 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold focus:outline-none focus:border-[#7ba05b]"
                      placeholder="현재 비밀번호 (초기: 0000)"
                      value={changePwForm.current}
                      onChange={(e) => setChangePwForm({ ...changePwForm, current: e.target.value })}
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-[#6c7d64] mb-1">새 비밀번호 (숫자 4자리)</label>
                    <input
                      type="password"
                      required
                      maxLength="4"
                      class="w-full px-3 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold focus:outline-none focus:border-[#7ba05b]"
                      placeholder="숫자 4자리 입력"
                      value={changePwForm.newPw}
                      onChange={(e) => setChangePwForm({ ...changePwForm, newPw: e.target.value })}
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-[#6c7d64] mb-1">새 비밀번호 확인</label>
                    <input
                      type="password"
                      required
                      maxLength="4"
                      class="w-full px-3 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold focus:outline-none focus:border-[#7ba05b]"
                      placeholder="새 비밀번호 재입력"
                      value={changePwForm.confirmPw}
                      onChange={(e) => setChangePwForm({ ...changePwForm, confirmPw: e.target.value })}
                    />
                  </div>

                  {pwChangeError && <p class="text-[#d96b63] text-xs font-bold text-center">{pwChangeError}</p>}

                  <div class="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setPwModalOpen(false)}
                      class="flex-1 py-2.5 bg-[#eef3e5] text-[#596951] rounded-2xl font-extrabold text-xs hover:bg-[#e2ebd6]"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      class="flex-1 py-2.5 bg-[#7ba05b] text-white rounded-2xl font-extrabold text-xs hover:bg-[#688a4a] shadow-sm"
                    >
                      변경하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Teacher Detail Modal */}
          {currentUser.role === 'teacher' && selectedStudent && (
            <div class="fixed inset-0 z-50 bg-[#2d3827]/40 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
              <div class="bg-[#fffdf7] w-full max-w-4xl rounded-[2.5rem] shadow-2xl border-4 border-[#e3eed4] my-auto flex flex-col max-h-[90vh] overflow-hidden">
                <div class="p-4 sm:p-6 border-b-2 border-[#e8edd8] flex justify-between items-center bg-[#f7faf0]">
                  <div>
                    <div class="flex items-center gap-2">
                      <h2 class="text-lg sm:text-xl font-extrabold text-[#4a5843]">{selectedStudent.name}</h2>
                      <span class="px-3 py-1 bg-[#e4edd4] text-[#55733a] text-xs font-extrabold rounded-full">{selectedStudent.id}</span>
                    </div>
                    <p class="text-xs font-bold text-[#8a9e80] mt-1">2026 인천고 1-2 학생 진로 및 학업 통합 개별 카드</p>
                  </div>
                  <button
                    onClick={() => setSelectedStudentId(null)}
                    class="p-2 text-[#8a9e80] hover:text-[#3b4737] hover:bg-[#e8edd8] rounded-full transition"
                  >
                    <Icon name="x" size={22} />
                  </button>
                </div>

                <div class="border-b-2 border-[#e8edd8] bg-[#fffdf7] px-4">
                  <div class="grid grid-cols-3 gap-2 py-2">
                    <button
                      onClick={() => setActiveTab('career')}
                      class={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${
                        activeTab === 'career' ? 'bg-[#7ba05b] text-white shadow-sm' : 'text-[#6c7d64] hover:bg-[#f2f6eb]'
                      }`}
                    >
                      <Icon name="compass" size={16} />
                      <span>🎯 진로/선택과목</span>
                    </button>
                    <button
                      onClick={() => setActiveTab('grades')}
                      class={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${
                        activeTab === 'grades' ? 'bg-[#7ba05b] text-white shadow-sm' : 'text-[#6c7d64] hover:bg-[#f2f6eb]'
                      }`}
                    >
                      <Icon name="bar-chart-2" size={16} />
                      <span>📊 성적 관리 & 그래프</span>
                    </button>
                    <button
                      onClick={() => setActiveTab('counseling')}
                      class={`py-2.5 px-3 rounded-2xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition ${
                        activeTab === 'counseling' ? 'bg-[#7ba05b] text-white shadow-sm' : 'text-[#6c7d64] hover:bg-[#f2f6eb]'
                      }`}
                    >
                      <Icon name="message-square" size={16} />
                      <span>💬 상담 기록</span>
                    </button>
                  </div>
                </div>

                <div class="p-4 sm:p-6 overflow-y-auto flex-1 bg-[#fbfcf7]">
                  <StudentDetailView
                    student={selectedStudent}
                    isTeacher={true}
                    activeTab={activeTab}
                    setStudents={setStudents}
                  />
                </div>
              </div>
            </div>
          )}

          {/* Add Student Modal */}
          {newStudentModal && (
            <div class="fixed inset-0 z-50 bg-[#2d3827]/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-[#fffdf7] w-full max-w-sm p-6 rounded-[2rem] shadow-2xl border-4 border-[#e3eed4]">
                <h3 class="text-lg font-extrabold text-[#4a5843] mb-4 flex items-center gap-2">
                  <Icon name="user-plus" size={18} className="text-[#7ba05b]" /> 신규 학생 등록
                </h3>
                <form onSubmit={handleAddStudent} class="space-y-4">
                  <div>
                    <label class="block text-xs font-extrabold text-[#6c7d64] mb-1">학번 (예: 10225)</label>
                    <input
                      type="text"
                      required
                      class="w-full px-3 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold focus:outline-none focus:border-[#7ba05b]"
                      value={newStudentForm.id}
                      onChange={(e) => setNewStudentForm({ ...newStudentForm, id: e.target.value })}
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-extrabold text-[#6c7d64] mb-1">이름</label>
                    <input
                      type="text"
                      required
                      class="w-full px-3 py-2.5 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold focus:outline-none focus:border-[#7ba05b]"
                      value={newStudentForm.name}
                      onChange={(e) => setNewStudentForm({ ...newStudentForm, name: e.target.value })}
                    />
                  </div>
                  <div class="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setNewStudentModal(false)}
                      class="flex-1 py-2.5 bg-[#eef3e5] text-[#596951] rounded-2xl font-extrabold text-xs hover:bg-[#e2ebd6]"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      class="flex-1 py-2.5 bg-[#7ba05b] text-white rounded-2xl font-extrabold text-xs hover:bg-[#688a4a] shadow-sm"
                    >
                      등록
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Student Detail View Component ---
    function StudentDetailView({ student, isTeacher, activeTab: propActiveTab, setStudents, appointments, setAppointments, students }) {
      const [localActiveTab, setLocalActiveTab] = useState('career');
      const currentTab = isTeacher ? propActiveTab : localActiveTab;

      // State for Career & Subjects (Multi-select support)
      const [careerForm, setCareerForm] = useState(student.targetCareer);
      const [majorForm, setMajorForm] = useState(student.targetMajor);
      const [subjectsForm, setSubjectsForm] = useState(student.subjects || {
        sem1: { social: [], science: [] },
        sem2: { math: [], social: [], science: [] }
      });

      // Roadmap detailed memo
      const [roadmapDetailsForm, setRoadmapDetailsForm] = useState(student.roadmapDetails || {});

      // Grades
      const [internalGradesForm, setInternalGradesForm] = useState(student.internalGrades);
      const [mockGradesForm, setMockGradesForm] = useState(student.mockGrades);

      // Chart Refs
      const internalChartRef = useRef(null);
      const mockChartRef = useRef(null);
      const internalChartInstance = useRef(null);
      const mockChartInstance = useRef(null);

      // Log Form
      const [newLog, setNewLog] = useState({
        date: new Date().toISOString().split('T')[0],
        category: '성적 향상 및 학습 전략',
        content: '',
        plan: ''
      });

      // Booking Form
      const [bookingForm, setBookingForm] = useState({
        date: '',
        category: '성적 향상 및 학습 전략',
        reason: ''
      });

      useEffect(() => {
        setCareerForm(student.targetCareer);
        setMajorForm(student.targetMajor);
        setSubjectsForm(student.subjects || {
          sem1: { social: [], science: [] },
          sem2: { math: [], social: [], science: [] }
        });
        setRoadmapDetailsForm(student.roadmapDetails || {});
        setInternalGradesForm(student.internalGrades);
        setMockGradesForm(student.mockGrades);
      }, [student]);

      // --- Chart Rendering Effect ---
      useEffect(() => {
        if (currentTab === 'grades') {
          // Render Internal Grades Chart
          if (internalChartRef.current) {
            if (internalChartInstance.current) internalChartInstance.current.destroy();
            const ctx = internalChartRef.current.getContext('2d');
            
            const sem1Avg = (Object.values(internalGradesForm.sem1).reduce((a,b)=>a+Number(b),0)/6).toFixed(2);
            const sem2Avg = (Object.values(internalGradesForm.sem2).reduce((a,b)=>a+Number(b),0)/6).toFixed(2);

            internalChartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: ['1학년 1학기 내신', '1학년 2학기 내신'],
                datasets: [{
                  label: '평균 등급 (낮을수록 우수)',
                  data: [sem1Avg, sem2Avg],
                  borderColor: '#7ba05b',
                  backgroundColor: 'rgba(123, 160, 91, 0.2)',
                  borderWidth: 3,
                  pointRadius: 6,
                  pointBackgroundColor: '#5c7a43',
                  tension: 0.1
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  y: {
                    reverse: true,
                    min: 1,
                    max: 9,
                    title: { display: true, text: '등급 (1~9)' }
                  }
                }
              }
            });
          }

          // Render Mock Exam Grades Chart
          if (mockChartRef.current) {
            if (mockChartInstance.current) mockChartInstance.current.destroy();
            const ctx = mockChartRef.current.getContext('2d');

            const marAvg = (Object.values(mockGradesForm.mar).reduce((a,b)=>a+Number(b),0)/6).toFixed(2);
            const junAvg = (Object.values(mockGradesForm.jun).reduce((a,b)=>a+Number(b),0)/6).toFixed(2);
            const sepAvg = (Object.values(mockGradesForm.sep).reduce((a,b)=>a+Number(b),0)/6).toFixed(2);
            const octAvg = (Object.values(mockGradesForm.oct).reduce((a,b)=>a+Number(b),0)/6).toFixed(2);

            mockChartInstance.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: ['3월 모의고사', '6월 모의고사', '9월 모의고사', '10월 모의고사'],
                datasets: [{
                  label: '전국연합 학력평가 평균 등급',
                  data: [marAvg, junAvg, sepAvg, octAvg],
                  borderColor: '#3a6351',
                  backgroundColor: 'rgba(58, 99, 81, 0.2)',
                  borderWidth: 3,
                  pointRadius: 6,
                  pointBackgroundColor: '#234235',
                  tension: 0.1
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  y: {
                    reverse: true,
                    min: 1,
                    max: 9,
                    title: { display: true, text: '등급 (1~9)' }
                  }
                }
              }
            });
          }
        }
      }, [currentTab, internalGradesForm, mockGradesForm]);

      // Subject Multi-Select Toggle Handler
      const toggleSubject = (sem, category, subject) => {
        if (!isTeacher) return;
        setSubjectsForm(prev => {
          const currentList = prev[sem][category] || [];
          const exists = currentList.includes(subject);
          const updated = exists ? currentList.filter(s => s !== subject) : [...currentList, subject];
          return {
            ...prev,
            [sem]: {
              ...prev[sem],
              [category]: updated
            }
          };
        });
      };

      const saveCareerData = () => {
        setStudents(prev => ({
          ...prev,
          [student.id]: {
            ...prev[student.id],
            targetCareer: careerForm,
            targetMajor: majorForm,
            subjects: subjectsForm,
            roadmapDetails: roadmapDetailsForm
          }
        }));
        alert('진로, 선택과목 및 로드맵 세부사항이 저장되었습니다.');
      };

      const saveGradesData = () => {
        setStudents(prev => ({
          ...prev,
          [student.id]: {
            ...prev[student.id],
            internalGrades: internalGradesForm,
            mockGrades: mockGradesForm
          }
        }));
        alert('내신 및 학력평가 성적 기록이 저장되었습니다.');
      };

      const handleAddLog = (e) => {
        e.preventDefault();
        if (!newLog.content) return;
        const updatedLogs = [...student.logs, { id: Date.now(), ...newLog }];
        setStudents(prev => ({
          ...prev,
          [student.id]: { ...prev[student.id], logs: updatedLogs }
        }));
        setNewLog({
          date: new Date().toISOString().split('T')[0],
          category: '성적 향상 및 학습 전략',
          content: '',
          plan: ''
        });
      };

      // Appointment Slot Counter
      const bookingSlotsCount = useMemo(() => {
        if (!bookingForm.date || !appointments) return 0;
        return appointments.filter(a => a.date === bookingForm.date && a.status !== '거절').length;
      }, [bookingForm.date, appointments]);

      const handleBookingSubmit = (e) => {
        e.preventDefault();
        if (!bookingForm.date || !bookingForm.reason) {
          alert('날짜와 상담 사유를 입력해 주세요.');
          return;
        }

        const day = new Date(bookingForm.date).getDay();
        if (day === 0 || day === 6) {
          alert('평일에만 상담 신청이 가능합니다.');
          return;
        }

        if (bookingSlotsCount >= 2) {
          alert('해당 일자는 하루 정원(2명)이 마감되었습니다.');
          return;
        }

        const newApp = {
          id: Date.now(),
          studentId: student.id,
          name: student.name,
          date: bookingForm.date,
          category: bookingForm.category,
          reason: bookingForm.reason,
          status: '신청'
        };

        setAppointments(prev => [...prev, newApp]);
        alert('상담 신청이 완료되었습니다.');
        setBookingForm({ date: '', category: '성적 향상 및 학습 전략', reason: '' });
      };

      return (
        <div>
          {!isTeacher && (
            <div class="mb-6 bg-[#fffdf7] p-2 rounded-3xl border-2 border-[#e3eed4] shadow-sm">
              <div class="grid grid-cols-3 gap-2">

                  <form onSubmit={handleBookingSubmit} class="bg-[#fffdf7] p-5 rounded-3xl border-2 border-[#e3eed4] shadow-sm space-y-4">
                    <h3 class="font-extrabold text-[#4a5843] text-sm flex items-center gap-2">
                      <Icon name="calendar" size={16} className="text-[#7ba05b]" /> 담임선생님 1:1 상담 신청
                    </h3>

                    <div>
                      <label class="block text-xs font-bold text-[#8c9e83] mb-1">희망 상담 일자 (평일만 가능)</label>
                      <input
                        type="date"
                        required
                        class="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.date}
                        onChange={(e) => setBookingForm({ ...bookingForm, date: e.target.value })}
                      />

                      {/* Display Slot Status */}
                      {bookingForm.date && (
                        <div class="mt-2.5 p-3 rounded-2xl border-2 flex justify-between items-center transition bg-[#f8faf2] border-[#e3eed4]">
                          <div class="text-xs font-extrabold text-[#4a5843]">
                            📅 선택 일자 예약 현황: <span class="text-[#7ba05b]">{bookingSlotsCount} / 2명</span>
                          </div>
                          {bookingSlotsCount >= 2 ? (
                            <span class="px-3 py-1 bg-[#f8ebf2] text-[#d96b63] border border-[#f2d0db] rounded-full text-xs font-extrabold flex items-center gap-1">
                              🔴 당일 마감 완료
                            </span>
                          ) : (
                            <span class="px-3 py-1 bg-[#eaf4f0] text-[#3a6351] border border-[#c1e2d4] rounded-full text-xs font-extrabold flex items-center gap-1">
                              🟢 신청 가능
                            </span>
                          )}
                        </div>
                      )}
                    </div>

                    <div>
                      <label class="block text-xs font-bold text-[#8c9e83] mb-1">상담 분야</label>
                      <select
                        class="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.category}
                        onChange={(e) => setBookingForm({ ...bookingForm, category: e.target.value })}
                      >
                        <option value="성적 향상 및 학습 전략">성적 향상 및 학습 전략</option>
                        <option value="진로진학 및 고교학점제">진로진학 및 고교학점제</option>
                        <option value="기타 개인적인 고민">기타 개인적인 고민</option>
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-bold text-[#8c9e83] mb-1">상담 사유</label>
                      <textarea
                        rows="3"
                        required
                        placeholder="상담을 희망하는 내용을 자유롭게 작성해 주세요."
                        class="w-full p-3 bg-[#f6f8f0] border-2 border-[#dde5d0] rounded-2xl text-xs font-bold text-[#3b4737] placeholder-[#a1b398] focus:outline-none focus:border-[#7ba05b]"
                        value={bookingForm.reason}
                        onChange={(e) => setBookingForm({ ...bookingForm, reason: e.target.value })}
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={bookingSlotsCount >= 2}
                      class={`w-full py-3.5 text-white font-extrabold rounded-2xl text-xs transition shadow-md ${
                        bookingSlotsCount >= 2 ? 'bg-[#c3cfb8] cursor-not-allowed' : 'bg-[#7ba05b] hover:bg-[#688a4a]'
                      }`}
                    >
                      {bookingSlotsCount >= 2 ? '해당 일자 상담이 마감되었습니다' : '상담 신청 제출하기'}
                    </button>
                  </form>

                  <div class="bg-[#fffdf7] p-5 rounded-3xl border-2 border-[#e3eed4] space-y-3">
                    <h4 class="font-extrabold text-[#4a5843] text-xs">나의 상담 신청 현황</h4>
                    <div class="space-y-2">
                      {appointments.filter(a => a.studentId === student.id).length === 0 ? (
                        <p class="text-xs font-bold text-[#8c9e83]">신청 내역이 없습니다.</p>
                      ) : (
                        appointments.filter(a => a.studentId === student.id).map(app => (
                          <div key={app.id} class="bg-[#f8faf2] p-3.5 rounded-2xl border-2 border-[#e3eed4] flex justify-between items-center text-xs font-bold">
                            <div>
                              <div class="text-[#4a5843]">{app.date} <span class="text-[#8c9e83]">({app.category})</span></div>
                              <div class="text-[#72826a] text-[11px] font-bold mt-0.5">{app.reason}</div>
                            </div>
                            <span class={`px-3 py-1 rounded-full text-[10px] font-extrabold ${
                              app.status === '승인' ? 'bg-[#eaf4f0] text-[#2a5241] border border-[#b8decb]' : 'bg-[#fff3d1] text-[#7a5b28] border border-[#f2d99d]'
                            }`}>
                              {app.status}
                            </span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
